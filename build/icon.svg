<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C7BF0"/>
      <stop offset="1" stop-color="#2346B8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B1A4A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Gabarit macOS : carré arrondi de 824 px centré -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Feuille -->
  <rect x="232" y="252" width="560" height="520" rx="44" fill="#FFFFFF"/>
