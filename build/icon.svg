  <g stroke="#C9D4F2" stroke-width="6">
    <line x1="232" y1="336" x2="792" y2="336"/>
    <line x1="232" y1="440" x2="792" y2="440"/>
    <line x1="232" y1="544" x2="792" y2="544"/>
    <line x1="232" y1="648" x2="792" y2="648"/>
    <line x1="328" y1="252" x2="328" y2="772"/>
    <line x1="560" y1="252" x2="560" y2="772"/>
  </g>
  <!-- Plage référencée (C1:C3), comme dans la grille -->
  <rect x="560" y="336" width="232" height="312" fill="#3E6BE8" fill-opacity="0.12"/>
  <rect x="563" y="339" width="226" height="306" fill="none" stroke="#3E6BE8" stroke-width="12" rx="4"/>
  <!-- Cellule de total -->
  <path d="M560 648 h232 v80 a44 44 0 0 1 -44 44 h-188 z" fill="#22B07D" fill-opacity="0.16"/>
  <path d="M566 654 h220 v74 a38 38 0 0 1 -38 38 h-182 z" fill="none" stroke="#1F9E70" stroke-width="12"/>
  <!-- Contenu évoqué -->
  <g fill="#9AAEE6">
    <rect x="364" y="378" width="160" height="22" rx="11"/>
    <rect x="364" y="482" width="124" height="22" rx="11"/>
    <rect x="364" y="586" width="144" height="22" rx="11"/>
  </g>
  <g fill="#3E6BE8">
