<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Atelier Tab — tableur et base de données hybride de la Suite Atelier, avec export DataFlow vers Atelier Projets."
    />
    <title>Atelier Tab</title>
    <script>
      // Applique le thème avant le premier rendu pour éviter un flash clair → sombre.
      // Deux marqueurs (docs/SUITE.md §1.5) : classe `dark` et `data-theme`. Voir useTheme.
      ;(function () {
        var root = document.documentElement
        var dark = false
        try {
          var p = localStorage.getItem('atelier-tab:theme')
          dark =
            p === 'dark' ||
            ((!p || p === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        } catch (e) {}
        root.classList.toggle('dark', dark)
        root.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
